<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitara · Revisão visual</title>
<style>
:root{font-family:system-ui,sans-serif;color:#f5f3fc;background:#070820;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:clamp(16px,4vw,48px)}h1{margin:12px 0;font-size:clamp(2rem,4vw,3.5rem)}header{max-width:900px}p{line-height:1.6;color:#d0c8df}.eyebrow{color:#28dceb;letter-spacing:.16em;font-weight:800;font-size:.75rem}a{color:#28dceb}.filters{display:flex;gap:20px;flex-wrap:wrap;margin:28px 0}label{display:grid;gap:8px}input,select{font:inherit;color:inherit;border:1px solid #80758f;background:#291a45;border-radius:10px;padding:12px;min-height:44px;max-width:100%}input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #28dceb;outline-offset:3px}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:20px}article{padding:20px;border:1px solid #55416e;border-radius:18px;background:#19112d;min-width:0}article img{display:block;width:100%;height:240px;object-fit:contain;background:#302443;border-radius:10px}h2{font-size:1.15rem;overflow-wrap:anywhere;margin-bottom:8px}code{font-size:.85rem;color:#28dceb;overflow-wrap:anywhere}article p{font-size:.85rem;margin:10px 0;overflow-wrap:anywhere}.category{color:#f9a7ef}.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{background:#291a45;border:1px solid #55416e;border-radius:20px;padding:4px 8px;font-size:.7rem}.caption{font-size:.8rem}#status{min-height:26px}
</style><script type="module" src="/dev/bitara-catalog.js"></script></head>
<body><header><p class="eyebrow">BITARIA · DESENVOLVIMENTO</p><h1>Biblioteca visual da Bitara</h1><p>Imagens oficiais, organizadas por uso pedagógico. Poses, objetos e pranchas permanecem identificados separadamente.</p><a href="/apresentacoes/?deck=bitara-demo">Ver apresentação de demonstração →</a></header>
<div class="filters"><label>Categoria<select id="category" aria-label="Categoria"><option value="">Todas as categorias</option></select></label><label>Buscar por nome, ID ou tag<input id="search" type="search" placeholder="Ex.: lupa, bitara-020"></label></div>
<p id="status" role="status" aria-live="polite">Carregando catálogo…</p><main id="gallery" aria-label="Imagens da Bitara"></main></body></html>
